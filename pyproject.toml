[tool.poetry]
name = "ner-pipeline"
version = "0.1.0"
description = "Pretrained transformer NER pipeline with idempotent Postgres ingestion and CoNLL-2003 eval-as-CI-gate."
authors = ["Sai Asish Y"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ner_pipeline", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
torch = ">=2.2,<3.0"
transformers = ">=4.40,<5.0"
datasets = ">=2.18,<3.0"
fastapi = ">=0.110,<1.0"
uvicorn = { version = ">=0.29,<1.0", extras = ["standard"] }
sqlalchemy = ">=2.0,<3.0"
alembic = ">=1.13,<2.0"
psycopg = { version = ">=3.1,<4.0", extras = ["binary"] }
pydantic = ">=2.5,<3.0"
pydantic-settings = ">=2.2,<3.0"
structlog = ">=24.1,<25.0"
prometheus-client = ">=0.20,<1.0"
faker = ">=24.0,<26.0"
seqeval = ">=1.2,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-asyncio = ">=0.23,<1.0"
pytest-cov = ">=5.0,<7.0"
factory-boy = ">=3.3,<4.0"
hypothesis = ">=6.100,<7.0"
ruff = ">=0.4,<1.0"
black = ">=24.3,<26.0"
mypy = ">=1.9,<2.0"
httpx = ">=0.27,<1.0"
testcontainers = { version = ">=4.4,<5.0", extras = ["postgres"] }
types-requests = ">=2.31,<3.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # black handles line length

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "N802"]
# FastAPI's `Depends(...)` in default args is the documented pattern.
"src/ner_pipeline/api.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
files = ["src/ner_pipeline"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["transformers.*", "datasets.*", "seqeval.*", "factory_boy.*", "factory.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring postgres (gated by RUN_INTEGRATION=1)",
    "eval_smoke: real-model eval tests (gated by RUN_EVAL_SMOKE=1)",
]

[tool.coverage.run]
source = ["src/ner_pipeline"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
