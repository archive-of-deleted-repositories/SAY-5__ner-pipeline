services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ner
      POSTGRES_PASSWORD: ner
      POSTGRES_DB: ner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ner -d ner"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NER_DATABASE_URL: postgresql+psycopg://ner:ner@postgres:5432/ner
      NER_LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn ner_pipeline.api:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
