name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.4.10 black==24.4.2
      - run: ruff check src tests
      - run: black --check src tests

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          pip install --upgrade pip
          pip install \
            "sqlalchemy>=2.0,<3.0" "pydantic>=2.5,<3.0" "pydantic-settings>=2.2,<3.0" \
            "fastapi>=0.110,<1.0" "alembic>=1.13,<2.0" \
            "psycopg[binary]>=3.1,<4.0" structlog prometheus-client \
            mypy==1.10.0
      - run: mypy src/ner_pipeline

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ner
          POSTGRES_PASSWORD: ner
          POSTGRES_DB: ner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ner -d ner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NER_TEST_DATABASE_URL: postgresql+psycopg://ner:ner@localhost:5432/ner_test
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: install
        run: |
          pip install --upgrade pip
          pip install \
            "sqlalchemy>=2.0,<3.0" "pydantic>=2.5,<3.0" "pydantic-settings>=2.2,<3.0" \
            "fastapi>=0.110,<1.0" "alembic>=1.13,<2.0" \
            "psycopg[binary]>=3.1,<4.0" structlog prometheus-client \
            "faker>=24.0,<26.0" "seqeval>=1.2,<2.0" \
            "hypothesis>=6.100,<7.0" \
            pytest pytest-asyncio pytest-cov httpx
      - name: unit tests
        run: pytest tests/unit -v --cov=src/ner_pipeline --cov-report=term-missing --cov-fail-under=85
      - name: integration tests
        run: pytest tests/integration -v

  bench-smoke:
    name: bench-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          pip install --upgrade pip
          pip install \
            "sqlalchemy>=2.0,<3.0" "pydantic>=2.5,<3.0" "pydantic-settings>=2.2,<3.0" \
            "fastapi>=0.110,<1.0" "alembic>=1.13,<2.0" \
            "psycopg[binary]>=3.1,<4.0" structlog prometheus-client \
            "faker>=24.0,<26.0"
      - name: bench-regress (200 docs, n+1 + perf gate)
        run: |
          PYTHONPATH=src python bench/ingest_bench.py \
            --n-docs 200 \
            --fail-on-n-plus-one \
            --regress-baseline bench/results/baseline_10k.json \
            --regress-tolerance 0.50

  eval-smoke:
    name: eval-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: cache HF Hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dslim-distilbert-ner-conll2003-v2
          restore-keys: |
            hf-dslim-distilbert-ner-
      - name: install
        run: |
          pip install --upgrade pip
          pip install \
            "torch>=2.2,<3.0" --index-url https://download.pytorch.org/whl/cpu
          pip install \
            "transformers>=4.40,<5.0" "datasets>=2.18,<3.0" \
            "sqlalchemy>=2.0,<3.0" "pydantic>=2.5,<3.0" "pydantic-settings>=2.2,<3.0" \
            "fastapi>=0.110,<1.0" "alembic>=1.13,<2.0" \
            "psycopg[binary]>=3.1,<4.0" structlog prometheus-client \
            "seqeval>=1.2,<2.0" pytest httpx
      - name: run smoke eval
        env:
          RUN_EVAL_SMOKE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          TRANSFORMERS_VERBOSITY: error
        run: pytest tests/eval -v -s

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ner-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
